name: Build Rocket Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk

          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Prepare Buildozer
        run: |
          buildozer init

      - name: Configure Buildozer
        run: |
          sed -i 's/^title = .*/title = Rocket Analyzer A-Series/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = rocketanalyzer/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.misteratom/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,kivymd,matplotlib/' buildozer.spec
          sed -i 's/^icon.filename = .*/icon.filename = icon.png/' buildozer.spec

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rocket-Analyzer-APK
          path: bin/*.apk